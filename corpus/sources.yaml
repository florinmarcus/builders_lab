# Shared regulations corpus: one entry per document. Schema and fetch methods: corpus/README.md.
# Built from research/domain/corpus-inventory/ (a, b, c, d), all checked 2026-11-19. Not legal advice.
# mode: ingest = open licence (OGL); restricted = prototype only, private storage, never committed (ADR 0008);
# link_only = paid or copyrighted, we store bibliographic facts and a link only (fetch method none).
# Never invent URLs or dates: anything unknown is left out or explained in notes.

defaults: {history_from: 2010-10-01}

sources:

