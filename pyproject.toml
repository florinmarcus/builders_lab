[project]
name = "builders-api"
version = "0.1.0"
description = "builders_lab demo backend: service layer, ingestion, MCP server"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "lxml>=5", "reportlab>=4.2", "numpy>=1.26", "boto3>=1.34"]  # numpy, boto3: tests/test_search.py
# Demo email feed on the server (admin feed) needs the PDF generator.
demo = ["reportlab>=4.2"]
# Demo Gmail loader, reset and live simulator (system/data/mock/gmail_demo.py), run on a laptop.
gmail = ["google-api-python-client>=2.150", "google-auth-oauthlib>=1.2", "reportlab>=4.2"]
# Corpus harvester and S3 copy (system/rag), run from the repo root.
corpus = ["pyyaml>=6", "requests>=2.31", "lxml>=5", "boto3>=1.34", "pdfplumber>=0.11", "pypdfium2>=4", "numpy>=1.26", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["system/api"]

[tool.setuptools.package-data]
builders_api = [
    "db/migrations/*.sql",
    "versions/*/*.md",
    "versions/versions.lock.json",
    "regulations_fallback/*.json",
    "terminology/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["system/api", "."]
