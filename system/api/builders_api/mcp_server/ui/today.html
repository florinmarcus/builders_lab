<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today</title>
<style>
/* MCP App for show_today (MCP Apps protocol 2026-01-26). Self-contained: no outside scripts or fonts. */
:root{color-scheme:light dark;--bg:#fff;--ink:#111;--soft:#5a5a57;--plane:#efefec;--line:#d8d8d4;--bar:#2b2b2a;--yel:#ffe600;--red:#e5342b}
:root[data-theme=dark]{--bg:#1a1a19;--ink:#f2f2ef;--soft:#b4b4ae;--plane:#262624;--line:#3a3a37;--bar:#d8d8d4}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{padding:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
h1{font-size:26px;line-height:1.1;letter-spacing:-.02em;margin:0;font-weight:800}
.sub{color:var(--soft);margin:4px 0 0;font-size:14px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{min-height:40px;padding:0 14px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:6px;font-weight:700}
.btn:focus-visible,.act:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.prog{background:var(--plane);border-radius:8px;padding:12px 12px 6px;margin-top:14px}
.row{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;min-height:34px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ref{font-weight:800;font-size:13px}
.lane{position:relative;height:34px}
.b{position:absolute;top:8px;height:18px;border-radius:3px;background:var(--bar)}
.b.due{background:var(--yel);outline:1.5px solid var(--ink)}
.b em{position:absolute;right:calc(100% + 6px);top:0;font-style:normal;font-size:12px;line-height:18px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:14px}
.card{border:1.5px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.hot{border-color:var(--ink)}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chead h3{margin:0;font-size:17px;line-height:1.2}
.pill{font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--plane);white-space:nowrap}
.pill.y{background:var(--yel);color:#111}
.meta{color:var(--soft);font-size:13px;margin:0}
ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
li{font-size:14px;padding-left:12px;position:relative}
li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
li small{color:var(--soft)}
.none{color:var(--soft);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.act{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--plane);font-size:13px;font-weight:600}
.act:hover{border-color:var(--ink)}
.msg{margin-top:12px;font-size:13px;color:var(--soft);min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="title">Today</h1><p class="sub" id="sub">Loading jobs…</p></div>
    <button class="btn" id="mail" type="button">Check new emails</button>
  </div>
  <section class="prog" id="prog" aria-label="Finish dates"></section>
  <div class="cards" id="cards"></div>
  <p class="msg" id="msg"></p>
</div>
<script>
{
let nextId=1;const pending={};
const send=m=>window.parent.postMessage({jsonrpc:"2.0",...m},"*");
const request=(method,params)=>new Promise((ok,fail)=>{const id=nextId++;pending[id]={ok,fail};send({id,method,params})});
const notify=(method,params)=>send({method,params});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const ACTS=[["What's missing?","What is still missing before {ref} can be handed over?"],
            ["Running late?","I'm running late on {ref}. What should I do?"],
            ["Draft a reply","Draft a reply to the latest email on {ref}."]];

function setTheme(t){if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}
function resize(){notify("ui/notifications/size-changed",{width:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight})}
function ask(text){
  document.getElementById("msg").textContent="Asking Claude…";
  request("ui/message",{role:"user",content:[{type:"text",text}]})
    .then(()=>{document.getElementById("msg").textContent=""})
    .catch(()=>{document.getElementById("msg").textContent="Could not send. Type it in the chat: "+text});
}
function render(d){
  const jobs=d.jobs||[];
  document.getElementById("title").textContent="Today, "+new Date(d.today+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  const due=jobs.filter(j=>j.due).length;
  document.getElementById("sub").textContent=`${jobs.length} jobs · ${due} due · ${d.emails_7_days} email${d.emails_7_days===1?"":"s"} this week`;
  const dated=jobs.filter(j=>j.target_date);
  if(dated.length){
    const t0=new Date(d.today).getTime(),days=dated.map(j=>j.days_left),max=Math.max(14,...days)+3;
    document.getElementById("prog").innerHTML=dated.map(j=>{
      const w=Math.max(4,Math.min(68,(Math.max(0,j.days_left)+1)/max*68));
      return `<div class="row"><span class="ref">${esc(j.ref)}</span><div class="lane"><div class="b${j.due?" due":""}" style="left:0;width:${w}%"><em style="right:auto;left:calc(100% + 6px)">${esc(fmt(j.target_date))}${j.days_left>0?` · ${j.days_left} days`:j.days_left===0?" · today":" · overdue"}</em></div></div></div>`}).join("");
  }else{document.getElementById("prog").hidden=true}
  document.getElementById("cards").innerHTML=jobs.map(j=>{
    const mails=(j.recent_emails||[]).map(e=>`<li>${esc(e.subject)} <small>· ${esc(e.from)}, ${esc(fmt(e.date))}</small></li>`).join("");
    const pill=j.due?`<span class="pill y">Due</span>`:`<span class="pill">${esc(j.status)}</span>`;
    return `<article class="card${j.due?" hot":""}"><div class="chead"><h3>${esc(j.title)}</h3>${pill}</div>
      <p class="meta">${esc(j.ref)} · ${esc(j.client)}${j.target_date?" · finish "+esc(fmt(j.target_date)):""}</p>
      ${mails?`<ul>${mails}</ul>`:`<p class="none">No emails this week.</p>`}
      <div class="acts">${ACTS.map(([label,q])=>`<button class="act" type="button" data-q="${esc(q.replace("{ref}",j.ref+" ("+j.title+")"))}">${esc(label)}</button>`).join("")}</div></article>`}).join("");
  resize();
}
document.getElementById("cards").addEventListener("click",e=>{const b=e.target.closest(".act");if(b)ask(b.dataset.q)});
document.getElementById("mail").addEventListener("click",()=>ask("Check my emails"));
window.addEventListener("message",ev=>{
  const m=ev.data;if(!m||m.jsonrpc!=="2.0")return;
  if(m.id!==undefined&&pending[m.id]){const p=pending[m.id];delete pending[m.id];m.error?p.fail(m.error):p.ok(m.result);return}
  if(m.method==="ui/notifications/tool-result"){
    const p=m.params||{};let d=p.structuredContent;
    if(!d&&p.content&&p.content[0]&&p.content[0].text){try{d=JSON.parse(p.content[0].text)}catch(_){}}
    if(d&&d.error){document.getElementById("sub").textContent=d.error.message||"Something went wrong.";resize();return}
    if(d)render(d);
  }
  if(m.method==="ui/notifications/host-context-changed")setTheme((m.params||{}).theme);
});
request("ui/initialize",{appInfo:{name:"builders-today",version:"1.0.0"},appCapabilities:{},protocolVersion:"2026-01-26"})
  .then(r=>{setTheme(r&&r.hostContext&&r.hostContext.theme);notify("ui/notifications/initialized",{});resize()})
  .catch(()=>{});
new ResizeObserver(resize).observe(document.body);
}
</script>
</body>
</html>
